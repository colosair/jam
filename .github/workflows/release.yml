# The release path. A `v*` tag on a main commit is the trigger; gate, publish,
# registry check and GitHub Release all happen here, authenticated by npm
# Trusted Publishing (OIDC) — no local login, no long-lived token. Local
# `npm publish` survives only as the emergency fallback in
# docs/operations/release.md.
#
# npm trusted-publishing contract (2026): GitHub-hosted runner, npm >= 11.5.1,
# Node >= 22.14, `permissions.id-token: write`, and each package connected to
# this repo + this workflow filename on npmjs.com.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm Trusted Publishing

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # CI's floor is Node 20, but trusted publishing needs >= 22.14.
          node-version: '22'
          cache: npm

      # The runner's bundled npm can trail the trusted-publishing floor.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: tag ↔ manifest ↔ main consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in launcher server bootstrap; do
            V=$(node -p "require('./packages/$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "::error::packages/$p is $V, tag says $TAG"; exit 1; }
          done
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag commit is not on main"; exit 1; }

      - run: npm ci

      # Same gate as CI, re-run on the exact commit being released.
      - run: npm run release:verify

      # Dependency order per docs/operations/release.md: bootstrap pins the
      # other two exactly, so it goes last. launcher and server pin each other
      # (circular), so their mutual order only follows the documented procedure.
      - name: publish (launcher → server → bootstrap)
        run: |
          for p in launcher server bootstrap; do (cd "packages/$p" && npm publish); done

      - name: registry verification
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in launcher server bootstrap; do
            ok=""
            for i in $(seq 1 30); do
              [ "$(npm view "@jam-mcp/$p@$TAG" version 2>/dev/null)" = "$TAG" ] && { ok=1; break; }
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::@jam-mcp/$p@$TAG never appeared on the registry"; exit 1; }
          done

      - name: published smoke
        run: |
          set -o pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PREFIX=$(mktemp -d)
          npm install -g --prefix "$PREFIX" "@jam-mcp/launcher@$TAG"
          "$PREFIX/bin/jam" --help | grep -q "runs the configured JAM runtime"
          "$PREFIX/bin/jam" runtime status --json > /dev/null

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "JAM $GITHUB_REF_NAME" \
            --generate-notes
