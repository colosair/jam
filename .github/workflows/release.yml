# Stage 1 of 2: publish. Dispatched by a maintainer against main; it gates,
# publishes all three packages via npm Trusted Publishing (OIDC), verifies the
# registry, and runs a published smoke. It creates NO tag and NO GitHub Release
# — those belong to release-finalize.yml, which runs only after acceptance
# against the published artefacts (docs/operations/release.md: a tag is created
# only after acceptance passes against the published packages).
#
# The filename stays release.yml because npm's trusted-publisher connection is
# bound to repo + workflow filename. Renaming it breaks publishing silently.
#
# npm trusted-publishing contract (2026): GitHub-hosted runner, npm >= 11.5.1,
# Node >= 22.14, `permissions.id-token: write`, and each package connected to
# this repo + this workflow filename on npmjs.com.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal the manifests on main HEAD, e.g. 1.4.4)'
        required: true
      dry_run:
        description: 'Run every gate but publish with --dry-run and skip registry/smoke'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm Trusted Publishing

concurrency:
  group: release-${{ inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish runs against main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # CI's floor is Node 20, but trusted publishing needs >= 22.14.
          node-version: '22'
          cache: npm

      # The runner's bundled npm can trail the trusted-publishing floor.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: version ↔ manifest consistency
        run: |
          V="${{ inputs.version }}"
          for p in launcher server bootstrap; do
            M=$(node -p "require('./packages/$p/package.json').version")
            [ "$M" = "$V" ] || { echo "::error::packages/$p is $M, dispatch says $V"; exit 1; }
          done

      # An immutable registry means a re-publish of the same version can only
      # fail late and confusingly. Refuse it up front instead.
      - name: version is not already published
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          for p in launcher server bootstrap; do
            if curl -fs -m 20 -o /dev/null "https://registry.npmjs.org/@jam-mcp%2f$p/$V"; then
              echo "::error::@jam-mcp/$p@$V already exists on the registry — bump the version instead"
              exit 1
            fi
          done

      - run: npm ci

      # Same gate as CI, re-run on the exact commit being published.
      - run: npm run release:verify

      # Dependency order per docs/operations/release.md: bootstrap pins the
      # other two exactly, so it goes last. launcher and server pin each other
      # (circular), so their mutual order only follows the documented procedure.
      - name: publish (launcher → server → bootstrap)
        run: |
          FLAGS=""
          if ${{ inputs.dry_run }}; then
            FLAGS="--dry-run"
            # npm refuses --dry-run over an already-published version too, and
            # a released version is the only honest target a pipeline dry run
            # has. Fall back to the packing check alone in that case.
            V="${{ inputs.version }}"
            if curl -fs -m 20 -o /dev/null "https://registry.npmjs.org/@jam-mcp%2flauncher/$V"; then
              echo "dry run: $V is already on the registry — npm pack --dry-run only (a real publish would be refused by the version gate)"
              for p in launcher server bootstrap; do (cd "packages/$p" && npm pack --dry-run); done
              exit 0
            fi
          fi
          for p in launcher server bootstrap; do (cd "packages/$p" && npm publish $FLAGS); done

      # npm's client cache can answer with a stale 404 for a version published
      # seconds earlier, and registry propagation has overrun a 5-minute window
      # for real (asc v0.3.2: publish succeeded, the old verification failed,
      # the Release was skipped). Ask the registry over HTTP with caching off,
      # and give propagation 15 minutes before calling it a failure.
      - name: registry verification
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          for p in launcher server bootstrap; do
            ok=""
            for i in $(seq 1 90); do
              if curl -fs -m 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                   -o /dev/null "https://registry.npmjs.org/@jam-mcp%2f$p/$V"; then
                ok=1
                echo "@jam-mcp/$p@$V visible after $(( (i - 1) * 10 ))s"
                break
              fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::@jam-mcp/$p@$V never appeared on the registry within 15 minutes"; exit 1; }
          done
          # The packument being served is not the same as npm being able to
          # resolve it: the install path has its own cache and CDN, and on the
          # v1.4.4 run this step passed while the smoke's install died with
          # ETARGET on @jam-mcp/server. Ask the resolver too, for every package
          # - an install pulls the dependencies, not just the entry point.
          for p in launcher server bootstrap; do
            ok=""
            for i in $(seq 1 30); do
              if [ "$(npm view --prefer-online "@jam-mcp/$p@$V" version 2>/dev/null)" = "$V" ]; then
                ok=1
                echo "npm resolves @jam-mcp/$p@$V after $(( (i - 1) * 10 ))s"
                break
              fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::npm could not resolve @jam-mcp/$p@$V within 5 minutes of it being served"; exit 1; }
          done

      - name: published smoke
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          PREFIX=$(mktemp -d)
          # Bounded retry: the install resolves the launcher AND its exact
          # server/bootstrap dependencies, so it can still meet a version that
          # has not propagated to every edge yet. Six attempts over five
          # minutes, then it is a real failure rather than a slow one.
          installed=""
          for i in $(seq 1 6); do
            if npm install -g --prefer-online --prefix "$PREFIX" "@jam-mcp/launcher@$V"; then
              installed=1
              [ "$i" -gt 1 ] && echo "install succeeded on attempt $i"
              break
            fi
            echo "install attempt $i failed; waiting for propagation"
            sleep 50
          done
          [ -n "$installed" ] || { echo "::error::@jam-mcp/launcher@$V could not be installed after 6 attempts over ~5 minutes"; exit 1; }
          # `jam --help` writes usage to stderr - stdout belongs to the MCP
          # protocol. Capture both streams, then grep the file (a pipe dies on
          # grep's exit 1 under pipefail — seen on the v1.4.1 run).
          export HOME=$(mktemp -d)
          "$PREFIX/bin/jam" --help > help.out 2>&1
          grep -q "runs the configured JAM runtime" help.out
          "$PREFIX/bin/jam" runtime use package
          "$PREFIX/bin/jam" runtime status --json > status.json
          node -e "const d=JSON.parse(require('fs').readFileSync('status.json')); if (d.mode !== 'package' || d.version !== process.argv[1]) { console.error(d); process.exit(1) }" "$V"

      - name: record the release-candidate identity
        run: |
          echo "### Release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "The durable record is npm provenance; finalize resolves the commit from the registry, not from this run."

      - name: what happens next
        run: |
          if ${{ inputs.dry_run }}; then
            echo "Dry run complete. Nothing was published."
          else
            echo "Published @jam-mcp/{launcher,server,bootstrap}@${{ inputs.version }}."
            echo "Run acceptance against the PUBLISHED packages (docs/operations/release.md),"
            echo "then dispatch release-finalize.yml with the same version to tag and cut the Release."
          fi
