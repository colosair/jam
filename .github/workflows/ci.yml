# The release gate a developer runs, run by the repository on every change.
#
# One job, one command: `npm run release:verify` is the same gate locally and
# here, so CI cannot quietly prove less than a developer does. Steps live in
# package.json rather than in this file for that reason.
#
# No Jira credentials, deliberately. Everything here must pass on a machine
# that has never seen a Jira token - source correctness is a separate question
# from whether a Jira instance is reachable, and mixing them makes a red build
# ambiguous. Live `jam doctor` acceptance stays in the release procedure, run
# by a human against a real site.
#
# The agent bootstrap end-to-end inside `smoke` is not an exception to that: it
# drives the whole install-bind-register-verify path against an in-process mock
# Jira on localhost, which needs no token and reaches no network.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PR title becomes the squash subject on main, so it is gated here:
  # English Conventional Commit, no Hangul (release conventions).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: conventional, English
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|chore|ci|test|refactor|perf|build|revert)(\([a-z0-9./-]+\))?!?: .+'; then
            echo "::error::PR title must be an English Conventional Commit subject - it becomes the squash subject on main"
            exit 1
          fi
          if echo "$TITLE" | grep -qP '[\x{AC00}-\x{D7A3}]'; then
            echo "::error::PR title must be English (Hangul found) - public git history is English"
            exit 1
          fi

  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a real answer about that platform, so let the
      # other finish rather than reporting a single red square for both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`: the lockfile is part of what is under test, and a
      # release whose lockfile has drifted is exactly what release:check fails on.
      - run: npm ci

      - run: npm run release:verify
