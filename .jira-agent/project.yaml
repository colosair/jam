# JAM project policy. Credentials never go in this file.
version: 1

project:
  # target-project. The Jira key is the ORG cohort code, not "target-project".
  key: PROJECT

search:
  # Page size sent to Jira - not a cap on the total result count.
  pageSize: 50
  # Safety stop for scope="complete". Reaching it is reported, never silent.
  maxPages: 20

fields:
  lite:
    - summary
    - status
    - assignee
    - priority
    - updated
    - labels
    - components
  context:
    - parent
    - subtasks
    - issuelinks
    - issuetype

# Project-specific fields surfaced at CONTEXT level and up.
# Example:
#   - id: customfield_10011
#     name: Sprint
customFields: []

output:
  searchTokens: 2000
  contextTokens: 5000
  fullTokens: 8000

policy:
  contextRequiredFor:
    - readiness
    - dependency
    - blocker
    - priority
  fullRequiredFor:
    - agreement
    - contract
    - approval
    - closure

telemetry:
  enabled: true
